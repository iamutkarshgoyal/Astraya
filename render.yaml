services:
  - type: web
    name: astraya-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head && python -m app.database.seed
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: EXPOSE_PASSWORD_RESET_TOKEN
        value: "false"
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        value: admin@astraya.in
      - key: OWNER_WHATSAPP_PHONE
        value: "919876543210"
      - key: DEFAULT_SHIPPING_CHARGE
        value: "99"
      - key: TAX_RATE_PERCENT
        value: "5"
      - key: CDN_GITHUB_USERNAME
        value: iamutkarshgoyal
      - key: CDN_GITHUB_REPOSITORY
        value: Astraya
      - key: CDN_GITHUB_BRANCH
        value: main
      - key: CDN_IMAGE_EXTENSION
        value: jpg
