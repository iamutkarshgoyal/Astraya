services:
  - type: web
    name: astraya-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: python --version && pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.database.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: EXPOSE_PASSWORD_RESET_TOKEN
        value: "false"
      - key: BACKEND_CORS_ORIGINS
        value: https://astrayacandles.com,https://www.astrayacandles.com
      - key: ADMIN_EMAIL
        value: admin@astraya.in
      - key: OWNER_WHATSAPP_PHONE
        value: "918958383707"
      - key: OWNER_NOTIFICATION_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v23.0
      - key: WHATSAPP_ORDER_TEMPLATE_NAME
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en_US
      - key: DEFAULT_SHIPPING_CHARGE
        value: "99"
      - key: TAX_RATE_PERCENT
        value: "5"
      - key: CDN_GITHUB_USERNAME
        value: iamutkarshgoyal
      - key: CDN_GITHUB_REPOSITORY
        value: Astraya
      - key: CDN_GITHUB_BRANCH
        value: main
      - key: CDN_IMAGE_EXTENSION
        value: jpg
