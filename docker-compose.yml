name: astraya

services:
  postgres:
    image: postgres:16-alpine
    container_name: astraya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Hello@123}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: astraya-backend
    build:
      context: ./backend
    restart: unless-stopped
    command: sh -c "alembic upgrade head && python -m app.database.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      PROJECT_NAME: Astraya API
      ENVIRONMENT: local
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Hello@123}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SECRET_KEY: ${SECRET_KEY:-change-this-before-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:-30}
      EXPOSE_PASSWORD_RESET_TOKEN: ${EXPOSE_PASSWORD_RESET_TOKEN:-true}
      OWNER_WHATSAPP_PHONE: ${OWNER_WHATSAPP_PHONE:-919876543210}
      DEFAULT_SHIPPING_CHARGE: ${DEFAULT_SHIPPING_CHARGE:-99}
      TAX_RATE_PERCENT: ${TAX_RATE_PERCENT:-5}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@astraya.in}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      CDN_BASE_URL: ${CDN_BASE_URL:-}
      CDN_GITHUB_USERNAME: ${CDN_GITHUB_USERNAME:-iamutkarshgoyal}
      CDN_GITHUB_REPOSITORY: ${CDN_GITHUB_REPOSITORY:-Astraya}
      CDN_GITHUB_BRANCH: ${CDN_GITHUB_BRANCH:-main}
      CDN_IMAGE_EXTENSION: ${CDN_IMAGE_EXTENSION:-jpg}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    container_name: astraya-frontend
    build:
      context: ./frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
